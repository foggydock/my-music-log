<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ミュージックログ">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ミュージックログ</title>
<style>
  :root{
    --bg:#0d0d12; --bg2:#16161f; --card:#1c1c28; --line:#2a2a3a;
    --txt:#f2f2f7; --sub:#9a9ab0; --accent:#ff4d6d; --accent2:#7c5cff;
    --ok:#34d399; --warn:#fbbf24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#16161f 0%,rgba(22,22,31,.92) 100%);
    backdrop-filter:blur(10px);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  header h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.02em; flex:1;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .icon-btn{
    background:var(--card); border:1px solid var(--line); color:var(--txt);
    width:38px; height:38px; border-radius:12px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{transform:scale(.94);}

  main{padding:16px; max-width:680px; margin:0 auto;}

  /* 追加バー */
  .addbar{display:flex; gap:8px; margin-bottom:18px;}
  .addbar input{
    flex:1; background:var(--bg2); border:1px solid var(--line); color:var(--txt);
    padding:13px 14px; border-radius:14px; font-size:15px; min-width:0;
  }
  .addbar input::placeholder{color:var(--sub);}
  .btn{
    border:none; border-radius:14px; padding:13px 18px; font-size:15px; font-weight:700;
    cursor:pointer; white-space:nowrap; color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.5;}
  .btn.ghost{background:var(--card); border:1px solid var(--line); color:var(--txt);}
  .btn.danger{background:#3a1c24; color:#ff8497; border:1px solid #5a2330;}

  /* グリッド */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:13px;}
  .cardx{
    background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;
    cursor:pointer; display:flex; flex-direction:column;
  }
  .cardx:active{transform:scale(.98);}
  .cover{width:100%; aspect-ratio:1/1; background:#000 center/cover no-repeat; position:relative;}
  .cover .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:34px; color:#3a3a4a;}
  .cardx .meta{padding:10px 11px 12px;}
  .cardx .t{font-size:14px; font-weight:700; line-height:1.3; margin:0 0 3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .cardx .a{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .empty{text-align:center; color:var(--sub); padding:60px 20px; line-height:1.8;}
  .empty .big{font-size:46px; margin-bottom:10px;}

  /* モーダル共通 */
  .overlay{
    position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.72);
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--bg2); width:100%; max-width:680px; max-height:92vh; overflow-y:auto;
    border-radius:22px 22px 0 0; border-top:1px solid var(--line);
    padding:18px 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-overflow-scrolling:touch;
  }
  .sheet h2{font-size:17px; margin:2px 0 16px;}
  .grab{width:40px; height:5px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
  label.fld{display:block; font-size:12px; color:var(--sub); margin:14px 0 6px; font-weight:600;}
  .sheet input.f, .sheet textarea.f{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--txt);
    padding:12px 13px; border-radius:12px; font-size:15px; font-family:inherit;
  }
  .sheet textarea.f{min-height:120px; resize:vertical; line-height:1.6;}
  .row{display:flex; gap:10px; margin-top:20px;}
  .row .btn{flex:1; text-align:center;}

  /* プレビューのカバー編集 */
  .coveredit{display:flex; gap:12px; align-items:center; margin-bottom:4px;}
  .coveredit .prev{width:84px; height:84px; border-radius:14px; background:#000 center/cover no-repeat; flex-shrink:0; border:1px solid var(--line);}
  .coveredit .ctrls{flex:1;}

  /* 詳細 */
  .detail-cover{position:relative; width:100%; aspect-ratio:1/1; border-radius:18px; background:#000 center/cover no-repeat; margin-bottom:16px; border:1px solid var(--line);}
  .detail h2{font-size:21px; margin:0 0 4px;}
  .detail .artist{color:var(--accent); font-weight:600; margin-bottom:16px;}
  .detail .bg{color:#dcdce6; line-height:1.85; font-size:15px; white-space:pre-wrap;}
  .detail .openlink{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:18px; text-decoration:none;}

  /* 切り抜き */
  .cropwrap{position:relative; width:100%; margin:10px 0; background:#000; border-radius:12px; overflow:hidden; touch-action:none;}
  .cropwrap img{display:block; width:100%; pointer-events:none; user-select:none;}
  .cropbox{position:absolute; border:2px solid #fff; box-shadow:0 0 0 9999px rgba(0,0,0,.55); cursor:move; touch-action:none;}
  .cropbox .hd{position:absolute; right:-11px; bottom:-11px; width:24px; height:24px; background:#fff; border-radius:50%; cursor:nwse-resize; border:3px solid var(--accent);}

  .hint{font-size:12px; color:var(--sub); line-height:1.6; margin:8px 0 0;}
  .status{font-size:13px; color:var(--sub); margin-top:10px; min-height:18px;}
  .status.err{color:#ff8497;}
  .spinner{display:inline-block; width:14px; height:14px; border:2px solid var(--sub); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* トースト */
  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%) translateY(20px);
    background:#2a2a3a; color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; z-index:200;
    opacity:0; transition:.25s; pointer-events:none; border:1px solid var(--line);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .count{font-size:12px; color:var(--sub); margin:0 0 12px 2px;}

  /* ツールバー（検索・並び替え・お気に入り絞り込み） */
  .toolbar{display:flex; gap:8px; align-items:center; margin-bottom:14px;}
  .toolbar .search{flex:1; min-width:0; background:var(--bg2); border:1px solid var(--line); color:var(--txt); padding:10px 12px; border-radius:12px; font-size:14px;}
  .toolbar .search::placeholder{color:var(--sub);}
  .toolbar .sortsel{background:var(--bg2); border:1px solid var(--line); color:var(--txt); padding:10px 8px; border-radius:12px; font-size:13px; -webkit-appearance:none; appearance:none;}
  .toolbar .favtoggle{background:var(--card); border:1px solid var(--line); color:var(--sub); width:42px; height:40px; border-radius:12px; font-size:18px; cursor:pointer; flex-shrink:0;}
  .toolbar .favtoggle.on{color:#ffd24d; border-color:#5a4a1a; background:#2a2410;}
  .toolbar .favtoggle:active{transform:scale(.94);}

  /* カード上の星ボタン */
  .favbtn{position:absolute; top:6px; right:6px; width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(0,0,0,.45); color:rgba(255,255,255,.5); font-size:16px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px); padding:0;}
  .favbtn.on{color:#ffd24d;}
  .favbtn:active{transform:scale(.88);}
  #dFav{width:40px; height:40px; font-size:20px; top:10px; right:10px;}
  .noresult{grid-column:1/-1; text-align:center; color:var(--sub); padding:44px 20px;}
</style>
</head>
<body>
<header>
  <h1>♪ ミュージックログ</h1>
  <button class="icon-btn" id="btnSettings" title="設定">⚙</button>
</header>

<main>
  <div class="addbar">
    <input id="urlInput" type="text" inputmode="url" placeholder="YouTube MusicのURLを貼り付け">
    <button class="btn ghost" id="btnPaste" title="貼り付け" style="padding:13px 13px;">📋</button>
    <button class="btn" id="btnFetch">調べる</button>
  </div>
  <div class="toolbar" id="toolbar" style="display:none">
    <input id="searchInput" class="search" type="search" placeholder="🔍 曲名・歌手で検索">
    <select id="sortSel" class="sortsel" aria-label="並び替え">
      <option value="new">新着順</option>
      <option value="old">古い順</option>
      <option value="song">曲名順</option>
      <option value="artist">歌手順</option>
    </select>
    <button class="favtoggle" id="favToggle" title="お気に入りだけ表示">★</button>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">🎧</div>
    気になった曲のURLを上に貼って<br>「調べる」を押すと、ここに並びます。
  </div>
</main>

<!-- プレビュー／編集シート -->
<div class="overlay" id="ovEdit">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="editTitle">曲の情報</h2>

    <label class="fld">カバー画像</label>
    <div class="coveredit">
      <div class="prev" id="prevCover"></div>
      <div class="ctrls">
        <button class="btn ghost" id="btnPickImg" style="width:100%; font-size:13px; padding:10px;">📷 スクショから選ぶ</button>
        <button class="btn ghost" id="btnUseThumb" style="width:100%; font-size:13px; padding:10px; margin-top:8px;">↩ 自動カバーに戻す</button>
      </div>
    </div>
    <input type="file" id="fileImg" accept="image/*" style="display:none">

    <label class="fld">曲名</label>
    <input class="f" id="fSong" type="text">
    <label class="fld">歌手・アーティスト</label>
    <input class="f" id="fArtist" type="text">
    <label class="fld">背景・成り立ち（Geminiの自動生成。参考メモなので必要なら直してください）</label>
    <textarea class="f" id="fBg"></textarea>

    <div class="status" id="editStatus"></div>
    <button class="btn ghost" id="btnRetry" style="display:none; width:100%; margin-top:10px; font-size:14px; padding:11px;">🔄 もう一度取得する</button>
    <div class="row">
      <button class="btn ghost" id="btnCancelEdit">キャンセル</button>
      <button class="btn" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- 詳細シート -->
<div class="overlay" id="ovDetail">
  <div class="sheet detail">
    <div class="grab"></div>
    <div class="detail-cover" id="dCover"><button class="favbtn" id="dFav" title="お気に入り">★</button></div>
    <h2 id="dSong"></h2>
    <div class="artist" id="dArtist"></div>
    <div class="bg" id="dBg"></div>
    <a class="btn openlink" id="dOpen" target="_blank" rel="noopener">▶ YouTube Musicで開く</a>
    <div class="row">
      <button class="btn ghost" id="btnEditFromDetail">編集</button>
      <button class="btn danger" id="btnDelete">削除</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="btn ghost" id="btnCloseDetail" style="flex:1;">閉じる</button>
    </div>
  </div>
</div>

<!-- 切り抜きシート -->
<div class="overlay" id="ovCrop">
  <div class="sheet">
    <div class="grab"></div>
    <h2>カバーを切り抜く</h2>
    <p class="hint">白い枠をドラッグして位置を、右下の丸で大きさを調整します。正方形で切り抜きます。</p>
    <div class="cropwrap" id="cropwrap">
      <img id="cropImg" alt="">
      <div class="cropbox" id="cropbox"><div class="hd" id="cropHandle"></div></div>
    </div>
    <div class="row">
      <button class="btn ghost" id="btnCropCancel">やめる</button>
      <button class="btn" id="btnCropOk">これで切り抜く</button>
    </div>
  </div>
</div>

<!-- 設定シート -->
<div class="overlay" id="ovSettings">
  <div class="sheet">
    <div class="grab"></div>
    <h2>設定</h2>
    <label class="fld">Gemini APIキー</label>
    <input class="f" id="fKey" type="password" placeholder="AIza... で始まるキー" autocomplete="off">
    <p class="hint">背景の文章を自動生成するのに使います。家計簿アプリと同じキーでOK。この端末のブラウザにだけ保存され、外部には送りません（Geminiへの問い合わせ時を除く）。<br>
    キー取得: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--accent2)">Google AI Studio</a></p>
    <label class="fld" style="margin-top:18px;">データの書き出し</label>
    <p class="hint">記録はこの端末に保存されています。バックアップ用に書き出せます。</p>
    <div class="row" style="margin-top:8px;">
      <button class="btn ghost" id="btnExport">JSON書き出し</button>
      <button class="btn ghost" id="btnImport">読み込み</button>
    </div>
    <input type="file" id="fileImport" accept="application/json,.json" style="display:none">
    <div class="row">
      <button class="btn" id="btnSaveSettings" style="flex:1;">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ====================== ストレージ ====================== */
const LS_ITEMS = "musiclog.items.v1";
const LS_KEY   = "musiclog.geminiKey.v1";
const GEMINI_MODEL = "gemini-2.5-flash";

function loadItems(){ try{ return JSON.parse(localStorage.getItem(LS_ITEMS)) || []; }catch(e){ return []; } }
function saveItems(items){ localStorage.setItem(LS_ITEMS, JSON.stringify(items)); }
function getKey(){ return localStorage.getItem(LS_KEY) || ""; }
function setKey(k){ localStorage.setItem(LS_KEY, k); }

let items = loadItems();

/* ====================== ユーティリティ ====================== */
const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900); }
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function openOv(el){ el.classList.add("open"); }
function closeOv(el){ el.classList.remove("open"); }

function extractVideoId(url){
  if(!url) return null;
  url = url.trim();
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split(/[/?#]/)[0] || null;
    const v = u.searchParams.get("v");
    if(v) return v;
  }catch(e){}
  const m = url.match(/[?&]v=([\w-]{11})/) || url.match(/youtu\.be\/([\w-]{11})/) || url.match(/([\w-]{11})/);
  return m ? m[1] : null;
}
function thumbUrl(id, hi){ return `https://i.ytimg.com/vi/${id}/${hi?"maxresdefault":"hqdefault"}.jpg`; }
function watchUrl(id){ return `https://music.youtube.com/watch?v=${id}`; }

/* ====================== 外部取得 ====================== */
// noembed（CORS対応）でタイトル・チャンネル名を取得。失敗時は null。
async function fetchOEmbed(id){
  const url = "https://noembed.com/embed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id);
  try{
    const r = await fetch(url);
    const j = await r.json();
    if(j && j.title) return { title:j.title, author:j.author_name||"" };
  }catch(e){}
  return null;
}

// Gemini で曲名・歌手・背景を整える
async function askGemini(rawTitle, author){
  const key = getKey();
  if(!key) throw new Error("NO_KEY");
  const ep = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`;
  const prompt =
`あなたは音楽に詳しいアシスタントです。あるYouTube Musicの動画について、次の情報が与えられます。
- 動画タイトル: ${rawTitle || "(不明)"}
- チャンネル名: ${author || "(不明)"}

ここから、実際の「曲名」と「アーティスト名」を特定してください（"Official Video"や"(Lyrics)"などの余計な語は曲名から除く。チャンネルが「○○ - Topic」ならその○○がアーティスト）。
さらに、その曲の背景・成り立ち（発表年、収録アルバム、制作の経緯、テーマ、エピソードなど分かる範囲）を日本語で200〜300字程度で書いてください。
確実に分からない部分は無理に断定せず、「〜と思われる」等の表現にするか省いてください。歌詞は書かないでください。`;
  const body = {
    contents:[{ parts:[{ text:prompt }] }],
    generationConfig:{
      temperature:0.4,
      responseMimeType:"application/json",
      responseSchema:{
        type:"OBJECT",
        properties:{
          songTitle:{type:"STRING"},
          artist:{type:"STRING"},
          background:{type:"STRING"}
        },
        required:["songTitle","artist","background"]
      }
    }
  };
  const r = await fetch(ep,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  if(!r.ok){
    let detail=""; try{ const e=await r.json(); detail=e.error&&e.error.message||""; }catch(_){}
    if(r.status===400 && /API key/i.test(detail)) throw new Error("BAD_KEY");
    throw new Error("GEMINI_"+r.status+(detail?": "+detail:""));
  }
  const j = await r.json();
  const txt = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts[0] && j.candidates[0].content.parts[0].text;
  if(!txt) throw new Error("EMPTY");
  return JSON.parse(txt);
}

/* ====================== 編集状態 ====================== */
let editing = null; // 編集中の作業オブジェクト

function newDraftFromFetch(id, song, artist, bg){
  return { id:null, videoId:id, url:watchUrl(id), songTitle:song||"", artist:artist||"", background:bg||"",
           cover:{ type:"thumb", value:thumbUrl(id,false) }, createdAt:null };
}

async function startFetch(){
  const raw = $("urlInput").value;
  const id = extractVideoId(raw);
  if(!id){ toast("URLから曲を判別できませんでした"); return; }

  const dup = items.find(x=>x.videoId===id);
  if(dup){
    if(confirm("この曲はすでに保存済みです。今ある記録を開きますか？\n（キャンセルすると新規としてもう一度追加します）")){
      $("urlInput").value=""; openDetail(dup.id); return;
    }
  }

  // まずカバーと下書きを用意して編集シートを開く（取得は後追いで埋める）
  editing = newDraftFromFetch(id, "", "", "");
  openEditSheet("曲の情報", true);
  await runFetch();
}

// editing.videoId の情報を取得してフォームに反映する。失敗しても「もう一度取得」で再試行できる。
async function runFetch(){
  if(!editing || !editing.videoId){ return; }
  const btnF=$("btnFetch"), btnR=$("btnRetry");
  btnF.disabled=true; btnF.textContent="調べ中…";
  btnR.disabled=true;
  setEditStatus("情報を取得しています…", false, true);

  // 既に入っている値を土台にしつつ、取れたら新しい情報で上書きする
  let rawTitle = $("fSong").value.trim();
  let author   = $("fArtist").value.trim();
  const oe = await fetchOEmbed(editing.videoId);
  if(oe){
    if(oe.title){  rawTitle=oe.title;  if(!$("fSong").value.trim())   $("fSong").value=oe.title; }
    if(oe.author){ author=oe.author;   if(!$("fArtist").value.trim()) $("fArtist").value=oe.author; }
  }

  if(!getKey()){
    setEditStatus("⚠ Geminiキー未設定。曲名・歌手は上の値（または手入力）で保存できます。背景はキー設定後に「もう一度取得」を。", true);
  }else{
    try{
      const g = await askGemini(rawTitle, author);
      if(g.songTitle) $("fSong").value = g.songTitle;
      if(g.artist) $("fArtist").value = g.artist;
      if(g.background) $("fBg").value = g.background;
      setEditStatus("取得しました。内容を確認して保存してください。", false);
    }catch(err){
      if(err.message==="BAD_KEY") setEditStatus("⚠ Geminiキーが無効のようです。設定を確認して「もう一度取得」を押してください。", true);
      else if(err.message==="NO_KEY") setEditStatus("⚠ Geminiキー未設定です。", true);
      else setEditStatus("⚠ 取得に失敗しました（"+err.message+"）。「もう一度取得」で再試行できます。", true);
    }
  }
  btnF.disabled=false; btnF.textContent="調べる";
  btnR.disabled=false;
}

function setEditStatus(msg, isErr, loading){
  const el=$("editStatus");
  el.className = "status" + (isErr?" err":"");
  el.innerHTML = (loading?'<span class="spinner"></span>':'') + esc(msg);
}

function openEditSheet(title, isNew){
  $("editTitle").textContent = title;
  renderCoverPrev();
  $("fSong").value   = editing.songTitle || "";
  $("fArtist").value = editing.artist || "";
  $("fBg").value     = editing.background || "";
  $("btnRetry").style.display = editing.videoId ? "block" : "none";
  if(isNew) setEditStatus("", false);
  openOv($("ovEdit"));
}

function renderCoverPrev(){
  const p=$("prevCover");
  const c=editing.cover;
  p.style.backgroundImage = c && c.value ? `url("${c.value}")` : "none";
}

function saveEdit(){
  const song=$("fSong").value.trim();
  if(!song){ toast("曲名を入れてください"); return; }
  editing.songTitle = song;
  editing.artist = $("fArtist").value.trim();
  editing.background = $("fBg").value.trim();
  if(editing.id){
    const i = items.findIndex(x=>x.id===editing.id);
    if(i>=0) items[i] = editing;
  }else{
    editing.id = uid();
    editing.createdAt = Date.now();
    items.unshift(editing);
  }
  saveItems(items);
  render();
  closeOv($("ovEdit"));
  $("urlInput").value="";
  toast("保存しました ♪");
  editing=null;
}

/* ====================== 表示 ====================== */
let searchText="", sortMode="new", favOnly=false;

function visibleItems(){
  let list = items.slice();
  if(favOnly) list = list.filter(x=>x.fav);
  if(searchText){
    const q = searchText.toLowerCase();
    list = list.filter(x =>
      (x.songTitle||"").toLowerCase().includes(q) ||
      (x.artist||"").toLowerCase().includes(q) ||
      (x.background||"").toLowerCase().includes(q));
  }
  switch(sortMode){
    case "old":    list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); break;
    case "song":   list.sort((a,b)=>(a.songTitle||"").localeCompare(b.songTitle||"","ja")); break;
    case "artist": list.sort((a,b)=>(a.artist||"").localeCompare(b.artist||"","ja")); break;
    default:       list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); // 新着
  }
  return list;
}

function render(){
  const grid=$("grid"), empty=$("empty"), toolbar=$("toolbar");
  if(items.length===0){ grid.innerHTML=""; empty.style.display="block"; toolbar.style.display="none"; $("count").textContent=""; return; }
  empty.style.display="none";
  toolbar.style.display="flex";
  const list = visibleItems();
  $("count").textContent = (list.length===items.length) ? items.length+" 曲" : list.length+" 曲 / 全"+items.length+"曲";
  if(list.length===0){ grid.innerHTML='<div class="noresult">該当する曲がありません</div>'; return; }
  grid.innerHTML = list.map(it=>{
    const cov = it.cover && it.cover.value;
    const bg = cov ? `style="background-image:url('${cov.replace(/'/g,"%27")}')"` : "";
    const ph = cov ? "" : '<div class="ph">♪</div>';
    return `<div class="cardx" data-id="${it.id}">
      <div class="cover" ${bg}>${ph}<button class="favbtn ${it.fav?'on':''}" data-fav="${it.id}" aria-label="お気に入り">★</button></div>
      <div class="meta"><p class="t">${esc(it.songTitle||"(無題)")}</p><p class="a">${esc(it.artist||"")}</p></div>
    </div>`;
  }).join("");
}

function toggleFav(id){
  const it = items.find(x=>x.id===id); if(!it) return;
  it.fav = !it.fav;
  saveItems(items);
  render();
  if(detailId===id) $("dFav").classList.toggle("on", !!it.fav);
}

let detailId=null;
function openDetail(id){
  const it=items.find(x=>x.id===id); if(!it) return;
  detailId=id;
  $("dCover").style.backgroundImage = it.cover&&it.cover.value ? `url("${it.cover.value}")` : "none";
  $("dSong").textContent = it.songTitle || "(無題)";
  $("dArtist").textContent = it.artist || "";
  $("dBg").textContent = it.background || "（背景メモはまだありません）";
  $("dOpen").href = it.url || watchUrl(it.videoId);
  $("dFav").classList.toggle("on", !!it.fav);
  openOv($("ovDetail"));
}

/* ====================== カバー切り抜き ====================== */
let cropState=null;
function openCrop(dataUrl){
  const img=$("cropImg");
  img.onload=()=>{
    const wrap=$("cropwrap");
    const w=wrap.clientWidth, h=img.clientHeight;
    const side=Math.min(w,h)*0.8;
    const box=$("cropbox");
    cropState={ w, h, side, x:(w-side)/2, y:(h-side)/2 };
    applyBox();
    openOv($("ovCrop"));
  };
  img.src=dataUrl;
}
function applyBox(){
  const b=$("cropbox"), s=cropState;
  b.style.left=s.x+"px"; b.style.top=s.y+"px"; b.style.width=s.side+"px"; b.style.height=s.side+"px";
}
function clampBox(){
  const s=cropState;
  s.side=Math.max(40, Math.min(s.side, s.w, s.h));
  s.x=Math.max(0, Math.min(s.x, s.w-s.side));
  s.y=Math.max(0, Math.min(s.y, s.h-s.side));
}
function pointer(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX, y:t.clientY}; }

function setupCropDrag(){
  const box=$("cropbox"), handle=$("cropHandle");
  let mode=null, start=null, orig=null;
  function down(m){ return e=>{ e.preventDefault(); mode=m; start=pointer(e); orig={...cropState}; }; }
  function move(e){
    if(!mode) return;
    e.preventDefault();
    const p=pointer(e), dx=p.x-start.x, dy=p.y-start.y;
    if(mode==="move"){ cropState.x=orig.x+dx; cropState.y=orig.y+dy; }
    else { cropState.side=orig.side+Math.max(dx,dy); }
    clampBox(); applyBox();
  }
  function up(){ mode=null; }
  box.addEventListener("mousedown", down("move"));
  box.addEventListener("touchstart", down("move"), {passive:false});
  handle.addEventListener("mousedown", e=>{e.stopPropagation(); down("size")(e);});
  handle.addEventListener("touchstart", e=>{e.stopPropagation(); down("size")(e);}, {passive:false});
  window.addEventListener("mousemove", move);
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("mouseup", up);
  window.addEventListener("touchend", up);
}

function doCrop(){
  const img=$("cropImg"), s=cropState;
  const scale = img.naturalWidth / s.w; // 表示→実ピクセル
  const sx=s.x*scale, sy=s.y*scale, ss=s.side*scale;
  const out=500;
  const cv=document.createElement("canvas"); cv.width=out; cv.height=out;
  const ctx=cv.getContext("2d");
  ctx.drawImage(img, sx, sy, ss, ss, 0, 0, out, out);
  const data=cv.toDataURL("image/jpeg", 0.82);
  editing.cover={ type:"image", value:data };
  renderCoverPrev();
  closeOv($("ovCrop"));
  toast("カバーを設定しました");
}

/* ====================== 設定・入出力 ====================== */
function exportData(){
  const blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="musiclog-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const arr=JSON.parse(r.result);
      if(!Array.isArray(arr)) throw 0;
      if(!confirm("読み込むと現在の "+items.length+" 曲を、ファイルの "+arr.length+" 曲で置き換えます。よろしいですか？")) return;
      items=arr; saveItems(items); render(); toast("読み込みました");
      closeOv($("ovSettings"));
    }catch(e){ toast("ファイルを読み込めませんでした"); }
  };
  r.readAsText(file);
}

/* ====================== イベント結線 ====================== */
$("btnFetch").addEventListener("click", startFetch);
$("urlInput").addEventListener("keydown", e=>{ if(e.key==="Enter") startFetch(); });

$("grid").addEventListener("click", e=>{
  const fb=e.target.closest(".favbtn");
  if(fb){ e.stopPropagation(); toggleFav(fb.dataset.fav); return; }
  const c=e.target.closest(".cardx"); if(c) openDetail(c.dataset.id);
});

// ツールバー（検索・並び替え・お気に入り絞り込み）
$("searchInput").addEventListener("input", e=>{ searchText=e.target.value.trim(); render(); });
$("sortSel").addEventListener("change", e=>{ sortMode=e.target.value; render(); });
$("favToggle").addEventListener("click", ()=>{ favOnly=!favOnly; $("favToggle").classList.toggle("on", favOnly); render(); });

// 詳細のお気に入りトグル
$("dFav").addEventListener("click", e=>{ e.stopPropagation(); if(detailId) toggleFav(detailId); });

// URLペースト
$("btnPaste").addEventListener("click", async ()=>{
  try{
    const t = await navigator.clipboard.readText();
    if(t && t.trim()){ $("urlInput").value=t.trim(); toast("貼り付けました"); $("urlInput").focus(); }
    else toast("クリップボードが空でした");
  }catch(e){ toast("貼り付けできません。長押しでペーストしてください"); }
});

$("btnCancelEdit").addEventListener("click", ()=>{ closeOv($("ovEdit")); editing=null; });
$("btnSave").addEventListener("click", saveEdit);
$("btnRetry").addEventListener("click", runFetch);

$("btnPickImg").addEventListener("click", ()=> $("fileImg").click());
$("fileImg").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=> openCrop(r.result);
  r.readAsDataURL(f);
  e.target.value="";
});
$("btnUseThumb").addEventListener("click", ()=>{
  if(editing && editing.videoId){ editing.cover={type:"thumb", value:thumbUrl(editing.videoId,false)}; renderCoverPrev(); }
});

$("btnCropCancel").addEventListener("click", ()=> closeOv($("ovCrop")));
$("btnCropOk").addEventListener("click", doCrop);

$("btnCloseDetail").addEventListener("click", ()=> closeOv($("ovDetail")));
$("btnEditFromDetail").addEventListener("click", ()=>{
  const it=items.find(x=>x.id===detailId); if(!it) return;
  editing=JSON.parse(JSON.stringify(it));
  closeOv($("ovDetail"));
  openEditSheet("編集", false);
});
$("btnDelete").addEventListener("click", ()=>{
  if(!detailId) return;
  if(!confirm("この曲を削除しますか？")) return;
  items=items.filter(x=>x.id!==detailId);
  saveItems(items); render(); closeOv($("ovDetail")); toast("削除しました");
});

$("btnSettings").addEventListener("click", ()=>{ $("fKey").value=getKey(); openOv($("ovSettings")); });
$("btnSaveSettings").addEventListener("click", ()=>{ setKey($("fKey").value.trim()); closeOv($("ovSettings")); });
$("btnExport").addEventListener("click", exportData);
$("btnImport").addEventListener("click", ()=> $("fileImport").click());
$("fileImport").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) importData(f); e.target.value=""; });

// オーバーレイ背景タップで閉じる（シート以外）
document.querySelectorAll(".overlay").forEach(ov=>{
  ov.addEventListener("click", e=>{ if(e.target===ov) closeOv(ov); });
});

setupCropDrag();
render();
</script>
</body>
